[build-system]
requires=["setuptools>=68", "wheel"]

[project]
name = "nba-wp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.5",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]